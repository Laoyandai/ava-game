*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070f;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
body{--back:linear-gradient(135deg,#2a62c9,#163a85);--felt:#1f7a45;--felt2:#0b3d22;--frame:none}
button{font-family:inherit;border:none;cursor:pointer}
#app{position:relative;max-width:430px;height:100vh;min-height:600px;margin:0 auto;overflow:hidden;background:linear-gradient(#1c1640,#0e0b22)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.table{background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 85%)}

.compass{grid-column:2;grid-row:2;align-self:center;width:66px;height:66px;border-radius:10px;background:rgba(0,0,0,.35);position:relative;font-size:11px}

.compass .c0{bottom:3px;left:50%;transform:translateX(-50%)}.compass .c2{top:3px;left:50%;transform:translateX(-50%)}

/* ===== v5 premium theme (deep navy + gold) ===== */
:root{--gold:#f3c969;--gold2:#c9962e;--gold3:#fff1c4;--line:rgba(243,201,105,.22);--txt2:#a9b3d1;--glass:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025))}
html,body{background:#05070f}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:.2px}
#app{background:radial-gradient(120% 55% at 50% -5%,#22305e 0%,#0e1634 46%,#070b19 100%)}
.screen.on{animation:scrIn .26s cubic-bezier(.2,.8,.3,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.coin{display:inline-block;width:20px;height:20px;flex:none;vertical-align:-5px;margin-right:4px;background:var(--coin) center/contain no-repeat}
.coin.sm{width:18px;height:18px;vertical-align:-4px;margin-right:3px}
.coin.lg{width:22px;height:22px}
@media (orientation:landscape){.coin,.coin.lg{width:24px;height:24px}.coin.sm{width:20px;height:20px}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.btn{background:linear-gradient(180deg,#4a6ef0,#2a46b8);box-shadow:0 3px 0 #18297a,0 6px 14px rgba(0,0,0,.25);transition:transform .08s,filter .08s;letter-spacing:1px}
.btn:active{transform:translateY(2px) scale(.97);filter:brightness(.92)}
.btn.gold{background:linear-gradient(180deg,#fff0b8 0%,#f3c969 42%,#c9962e 100%);color:#3a2600;box-shadow:0 3px 0 #8a6110,0 6px 16px rgba(201,150,46,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gray{background:linear-gradient(180deg,#5b6480,#3a4159);box-shadow:0 3px 0 #23283a}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);color:var(--gold3)}
.btn.big{width:100%;padding:14px;font-size:18px;border-radius:16px}
.modal{background:linear-gradient(160deg,#1d2850,#0f1530);border:1px solid rgba(243,201,105,.45);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);animation:mIn .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes mIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.modal h3{color:var(--gold);letter-spacing:2px}
#mask{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.brk{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)}
.topbar{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.15));border-bottom:1px solid rgba(243,201,105,.12)}
.tb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1)}
.tb:active{transform:scale(.94)}
/* scroll + tabbar */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:84px}
.scroll::-webkit-scrollbar{display:none}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:62px;display:none;z-index:40;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(12,18,40,.75),rgba(6,9,22,.96));border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tabbar.on{display:flex}
#tabbar button{flex:1;background:none;color:#8590b3;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
#tabbar button svg{width:24px;height:24px}
#tabbar button.on{color:var(--gold)}
#tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(243,201,105,.6))}
.hdr{display:flex;align-items:center;height:50px;padding:0 12px;gap:8px;flex:none}
.hdr h2{flex:1;text-align:center;font-size:17px;letter-spacing:2px;color:var(--gold3)}
.hdr .bk{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:20px}
.chip{display:inline-flex;align-items:center;padding:4px 10px 4px 5px;border-radius:20px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25));border:1px solid rgba(243,201,105,.45);color:var(--gold3);font-weight:800;font-size:14px;white-space:nowrap}
.chip .plus{margin-left:6px;width:18px;height:18px;border-radius:50%;background:linear-gradient(#ffe9a3,#c9962e);color:#3a2600;font-size:14px;line-height:18px;text-align:center}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.5px}
.tag.test{background:rgba(255,152,0,.18);color:#ffb74d;border:1px solid rgba(255,152,0,.4)}
.sim{font-size:10px;color:#8b95b8}
/* avatar + frames */
.av{isolation:isolate}
.fr::before{content:'';position:absolute;inset:-4px;border-radius:50%;z-index:-1;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.fr-f1::before{background:conic-gradient(#8a5a2b,#e0a36a,#8a5a2b,#c98a4f,#8a5a2b)}
.fr-f2::before{background:conic-gradient(#9aa3b2,#ffffff,#9aa3b2,#e8ecf2,#9aa3b2)}.fr-f2{box-shadow:0 0 10px rgba(255,255,255,.35)}
.fr-f3::before{background:conic-gradient(from 0deg,#a8761a,#fff1b8,#e0a93a,#a8761a,#ffe08a,#a8761a);animation:spin 4s linear infinite}.fr-f3{box-shadow:0 0 14px rgba(255,200,80,.55)}
.fr-f4::before{inset:-5px;background:conic-gradient(#7ef9ff,#b37bff,#ffffff,#7ef9ff,#5b8cff,#b37bff,#7ef9ff);animation:spin 2.6s linear infinite}.fr-f4{box-shadow:0 0 18px rgba(126,249,255,.6)}
.fr-f5::before{inset:-6px;background:conic-gradient(#ffd54a,#d4141c,#fff3c0,#ffb300,#d4141c,#ffd54a);animation:spin 2s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px))}
.fr-f5{box-shadow:0 0 20px rgba(255,190,40,.75)}
.fr-f5::after{content:'♛';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:15px;color:#ffd54a;text-shadow:0 0 6px #ff9800,0 1px 0 #7a3b00}
@keyframes spin{to{transform:rotate(1turn)}}
/* lobby */
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.lh .av{width:48px;height:48px;font-size:27px}
.lh .nm{font-size:16px;font-weight:800}
.lh .uid{font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marq{margin:6px 14px 0;height:28px;border-radius:14px;display:flex;align-items:center;gap:6px;padding:0 10px;overflow:hidden;font-size:12px;color:#ffe9b0;background:rgba(243,201,105,.08);border:1px solid rgba(243,201,105,.18)}
.marq .tr{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:28px}
.marq .tr span{position:absolute;top:6px;left:0;animation:marq 22s linear infinite;padding-left:100%}
@keyframes marq{to{transform:translateX(-100%)}}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:10px 14px 4px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:center;height:124px;border-radius:18px;position:relative;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(255,255,255,.12)}
.slide h4{font-size:18px;letter-spacing:1px;margin-bottom:4px}
.slide p{font-size:12px;opacity:.9;line-height:1.5}
.slide .art{position:absolute;right:-6px;bottom:-8px;font-size:78px;opacity:.9;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.s1{background:radial-gradient(circle at 85% 80%,rgba(255,120,40,.55),transparent 55%),linear-gradient(120deg,#3a1220,#7a2418)}
.s2{background:radial-gradient(circle at 85% 80%,rgba(120,200,255,.45),transparent 55%),linear-gradient(120deg,#0f2a5a,#1d4f8a)}
.s3{background:radial-gradient(circle at 85% 80%,rgba(243,201,105,.5),transparent 55%),linear-gradient(120deg,#2b1d4a,#5a2f78)}
.dots{display:flex;justify-content:center;gap:5px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);transition:all .3s}
.dots i.on{width:16px;background:var(--gold)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;font-size:14px;font-weight:800;color:var(--gold3);letter-spacing:1px}
.sec small{font-weight:400;color:var(--txt2);font-size:11px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.gcard{height:176px;border-radius:20px;position:relative;overflow:hidden;display:block;padding:12px;border:1.5px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .12s}
.gcard:active{transform:scale(.97)}
.gcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(243,201,105,.35),0 10px 24px rgba(0,0,0,.35)}
.gcard .gt{position:absolute;left:12px;bottom:28px;font-size:24px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.gcard .gs{position:absolute;left:12px;bottom:10px;font-size:10.5px;opacity:.9}
.gcard .on-n{position:absolute;right:10px;top:10px;font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.35)}
.gcard .on-n:before{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:#4cff8f;margin-right:4px;box-shadow:0 0 6px #4cff8f}
.g1{background:radial-gradient(circle at 70% 30%,rgba(255,180,90,.45),transparent 60%),linear-gradient(150deg,#b3281e,#4b0d1a)}
.g2{background:radial-gradient(circle at 70% 30%,rgba(120,255,190,.35),transparent 60%),linear-gradient(150deg,#137a4f,#06301f)}
.gart{position:absolute;left:0;right:0;top:14px;height:110px;display:flex;justify-content:center;align-items:center}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.tier{border-radius:14px;padding:10px 6px;text-align:center;background:var(--glass);border:1px solid rgba(255,255,255,.1);transition:all .15s;position:relative}
.tier b{display:block;font-size:14px;letter-spacing:1px}
.tier .fee{margin:6px 0 2px;font-size:15px;font-weight:900;color:var(--gold3);display:flex;align-items:center;justify-content:center}
.tier small{font-size:10px;color:var(--txt2);line-height:1.4;display:block}
.tier.sel{border-color:var(--gold);background:linear-gradient(160deg,rgba(243,201,105,.22),rgba(243,201,105,.05));box-shadow:0 0 14px rgba(243,201,105,.25)}
.tier.lack:after{content:'余额不足';position:absolute;top:-7px;right:-4px;font-size:9px;padding:1px 5px;border-radius:6px;background:#a33;color:#fff}
.qs{padding:12px 14px 2px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.qgrid button{height:76px;border-radius:16px;background:var(--glass);border:1px solid rgba(255,255,255,.08);color:#e8ecff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qgrid button:active{transform:scale(.96)}
.qgrid .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.3)}
.foot{font-size:10.5px;color:#7f89ad;text-align:center;line-height:1.6;padding:14px 18px 6px}
/* shop */
.seg{display:flex;gap:6px;padding:4px 12px 8px}
.seg button{flex:1;padding:8px 0;border-radius:12px;background:rgba(255,255,255,.06);color:#b8c0dc;font-size:13px;border:1px solid transparent;transition:all .2s}
.seg button.on{background:linear-gradient(180deg,rgba(243,201,105,.25),rgba(243,201,105,.08));color:var(--gold3);border-color:var(--line);font-weight:800}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px}
.sitem{border-radius:16px;padding:8px;background:var(--glass);border:1.5px solid var(--rc,#666);position:relative;overflow:hidden;transition:transform .12s}
.sitem:active{transform:scale(.97)}
.sitem .pv{height:112px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:rgba(0,0,0,.25)}
.sitem .nm{font-size:14px;font-weight:800;margin-top:7px}
.sitem .pr{display:flex;align-items:center;justify-content:space-between;margin-top:5px;font-size:13px;color:var(--gold3);font-weight:800}
.rar{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;padding:1px 7px;border-radius:8px;color:#fff;font-weight:800;background:var(--rc);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.st-own{font-size:11px;color:#8fe3b0;font-weight:700}.st-eq{font-size:11px;color:var(--gold);font-weight:800}
.r0{--rc:#7b8496}.r1{--rc:#3d8bff}.r2{--rc:#a35bff}.r3{--rc:#f0a91e}
.r3.sitem{box-shadow:0 0 16px rgba(240,169,30,.28)}
.r3 .pv::after,.r2 .pv::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.pcard{width:58px;height:82px;border-radius:7px;border:2px solid #f6e3a6;box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.15);position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;inset:5px;border:1px solid rgba(255,240,190,.55);border-radius:4px}
.ptile{width:40px;height:56px;background-size:100% 100%;filter:drop-shadow(1px 3px 3px rgba(0,0,0,.45))}
.pfelt{width:100%;height:100%;border-radius:12px;position:relative}
.pemo{font-size:52px;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
/* my page */
.prof{margin:6px 14px 0;padding:16px;display:flex;gap:14px;align-items:center}
.prof .av{width:64px;height:64px;font-size:36px}
.prof .nm{font-size:18px;font-weight:900;display:flex;align-items:center;gap:6px}
.prof .nm button{background:none;color:var(--gold);font-size:14px}
.prof .uid{font-size:12px;color:var(--txt2);margin-top:3px;display:flex;align-items:center;gap:6px}
.prof .uid button{font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff}
.balcard{margin:10px 14px 0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:radial-gradient(circle at 90% 10%,rgba(243,201,105,.35),transparent 55%),linear-gradient(120deg,#2a2458,#3c2a14);border:1px solid rgba(243,201,105,.4);border-radius:18px}
.balcard .v{font-size:28px;font-weight:900;color:var(--gold3);display:flex;align-items:center}
.balcard .v .coin{width:22px;height:22px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 14px 0}
.stats div{padding:10px 6px;text-align:center;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.07)}
.stats b{display:block;font-size:17px;color:var(--gold3)}
.stats span{font-size:11px;color:var(--txt2)}
.menu{margin:12px 14px 0;border-radius:18px;overflow:hidden;background:var(--glass);border:1px solid rgba(255,255,255,.07)}
.menu>button,.menu .row{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:none;color:#e8ecff;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.menu>button:last-child,.menu .row:last-child{border-bottom:none}
.menu .mi{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.menu .ar{margin-left:auto;color:#6c7699}
.menu .row .r{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt2)}
.menu .grp{padding:10px 14px 4px;font-size:11px;color:var(--gold);letter-spacing:1px}
.sw{width:46px;height:26px;border-radius:13px;background:#3a4159;position:relative;transition:background .2s;flex:none;border:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(90deg,#c9962e,#f3c969)}
.sw.on::after{left:23px}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p,50%),#3a4159 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--gold)}
.segm{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.segm button{padding:5px 12px;background:none;color:#b8c0dc;font-size:12px}
.segm button.on{background:var(--gold);color:#3a2600;font-weight:800}
.rec{margin:0 14px 8px;padding:12px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font-size:13px}
.rec .gi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.rec .inf{flex:1;min-width:0}
.rec .inf small{display:block;color:var(--txt2);font-size:11px;margin-top:2px}
.rec .amt{font-weight:900;font-size:15px;display:flex;align-items:center;white-space:nowrap}
.empty{text-align:center;color:var(--txt2);padding:50px 20px;font-size:13px}
.empty div{font-size:46px;margin-bottom:8px;opacity:.6}
/* splash */
#splash{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#22305e,#070b19 70%);transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{width:112px;height:112px;background:var(--coin2) center/contain no-repeat;animation:coinSpin 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(243,201,105,.45))}
@keyframes coinSpin{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
#splash h1{margin-top:18px;font-size:26px;letter-spacing:8px;background:linear-gradient(180deg,#fff3c4,#f3c969 50%,#b98420);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin-top:6px;font-size:12px;color:var(--txt2);letter-spacing:3px}
#splash .bar{margin-top:26px;width:180px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9962e,#fff1c4);animation:load 1.2s ease-out forwards}
@keyframes load{to{width:100%}}
#splash small{position:absolute;bottom:26px;font-size:10px;color:#6c7699}
/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.cf{position:absolute;top:-20px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.cimg{position:absolute;width:26px;height:26px;background:var(--coin) center/contain no-repeat}
.cfall{top:-30px;animation:fall linear forwards}
.cfly{transition:transform .8s cubic-bezier(.3,.6,.3,1),opacity .8s}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
.loseflash{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(10,10,30,.75));animation:lf 1.6s forwards}
@keyframes lf{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.burnfx{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,80,20,.18),rgba(255,80,20,.04));border:1px solid rgba(255,120,60,.35)}
.flame{width:26px;height:34px;position:relative;flex:none}
.flame i{position:absolute;left:50%;bottom:0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:translateX(-50%);animation:flick .5s ease-in-out infinite alternate}
.flame i:nth-child(1){width:24px;height:32px;background:radial-gradient(circle at 50% 70%,#ffcf3f,#ff5a1f 60%,rgba(255,60,0,0) 72%)}
.flame i:nth-child(2){width:14px;height:20px;bottom:2px;background:radial-gradient(circle at 50% 70%,#fff6c8,#ffb52e 70%,rgba(255,150,0,0) 80%);animation-duration:.35s}
@keyframes flick{to{transform:translateX(-50%) scaleY(1.12) scaleX(.92) skewX(4deg)}}
.burnfx .bv{font-size:18px;font-weight:900;color:#ff9a6a}
.burnfx small{display:block;font-size:10.5px;color:#ffc9b0}
.resbanner{text-align:center;font-size:30px;font-weight:900;letter-spacing:6px;margin:-4px 0 6px;animation:rb .6s cubic-bezier(.2,1.4,.4,1)}
.resbanner.win{background:linear-gradient(180deg,#fff3c4,#f3c969 50%,#c9962e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(243,201,105,.5))}
.resbanner.lose{color:#9aa6c8}
@keyframes rb{from{transform:scale(2);opacity:0}}
/* game polish */
.card.dealin{animation:dealIn .32s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes dealIn{from{transform:translate(0,-220px) rotate(-12deg);opacity:0}}
.playin{animation:playIn .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes playIn{from{transform:translateY(30px) scale(.75);opacity:0}}
.tile.dropin{animation:dropIn .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes dropIn{from{transform:scale(1.8);opacity:0}}
body.bigc #dz-hand .card{width:50px;height:70px}
body.bigc #mj-hand .tile{width:26px;height:37px}
/* chat */
.bubble{position:absolute;z-index:70;max-width:180px;padding:7px 11px;border-radius:14px;background:#fff;color:#1b2140;font-size:12.5px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bIn .25s cubic-bezier(.2,1.3,.4,1);pointer-events:none;word-break:break-all}
.bubble::after{content:'';position:absolute;bottom:-6px;left:var(--ax,18px);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.out{transition:opacity .3s;opacity:0}
.bubble.emo{font-size:26px;padding:4px 10px}
@keyframes bIn{from{transform:scale(.6);opacity:0}}
.chatlog{max-height:150px;overflow-y:auto;background:rgba(0,0,0,.25);border-radius:12px;padding:8px;font-size:12px;line-height:1.6;margin-bottom:8px}
.chatlog .me{color:var(--gold3)}
.chatlog b{color:#8fc8ff;font-weight:700}
.qp{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto}
.qp button{text-align:left;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.07);color:#e8ecff;font-size:13px;border:1px solid rgba(255,255,255,.06)}
.qp button:active{background:rgba(243,201,105,.2)}
.erow{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.erow button{font-size:22px;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06)}
.crow2{display:flex;gap:6px}
.crow2 .inp{font-size:14px;padding:9px 10px}
.mebar .bal{display:flex;align-items:center;color:var(--gold3);font-weight:800}
#sndban{top:auto;bottom:74px}

.bubble.below::after{bottom:auto;top:-6px;border-top-color:transparent;border-bottom:6px solid #fff;border-top:0}
.emo-fly .cimg{animation:none}
.bubble{z-index:45}
.crow2 .btn{flex:none;white-space:nowrap}
.chatlog>div{padding:1px 0}

/* ===== responsive shell ===== */
#app{max-width:none;min-height:0;height:100vh;margin:0 auto}
.screen{padding-top:env(safe-area-inset-top)}
.screen.table{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}

/* ===== LANDSCAPE ===== */
body.land .coin,body.land .coin.lg{width:24px;height:24px}body.land .coin.sm{width:20px;height:20px}
/* tab bar -> left side rail */
body.land #tabbar{top:0;bottom:0;right:auto;width:calc(76px + env(safe-area-inset-left));height:auto;flex-direction:column;justify-content:center;gap:10px;padding:10px 4px 10px calc(4px + env(safe-area-inset-left));border-top:none;border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(6,9,22,.96),rgba(12,18,40,.8))}
body.land #tabbar button{flex:none;height:62px;border-radius:14px;font-size:12px;gap:4px}
body.land #tabbar button.on{background:rgba(243,201,105,.1)}
body.land #tabbar button svg{width:26px;height:26px}
body.land #sc-lobby,body.land #sc-shop,body.land #sc-rank,body.land #sc-my{left:calc(76px + env(safe-area-inset-left))}
body.land .screen:not(.table){padding-right:env(safe-area-inset-right)}
body.land #sc-records,body.land #sc-assets,body.land #sc-items,body.land #sc-settings,body.land #sc-rules{padding-left:env(safe-area-inset-left)}
body.land .scroll{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
body.land #sndban{bottom:14px}
body.land #sndban{top:50px;bottom:auto}
body.land .hdr{height:46px}
/* lobby: 2 columns */
body.land .lcols{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start}
body.land .lcol{min-width:0}
body.land .lh{padding:10px 16px 4px}
body.land .marq{margin:4px 16px 0}
body.land .car{padding-top:8px}
body.land .slide{height:96px}
body.land .slide h4{font-size:16px}body.land .slide .art{font-size:64px}
body.land .gcard{height:150px}
body.land .lcol:last-child .sec:first-child{padding-top:12px}
body.land .qgrid button{height:62px;flex-direction:row;gap:8px;font-size:13px}
body.land .qgrid .ic{width:32px;height:32px;font-size:18px}
body.land .tier{padding:8px 6px}
body.land .qs{padding:10px 14px 0}
body.land .btn.big{padding:12px}
body.lwide .lcols{grid-template-columns:1.1fr 1fr}
body.lwide .gcard{height:200px}
/* shop / items: multi column */
body.land .sgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:2px 16px}
body.land .seg{padding:4px 16px 8px;max-width:720px;margin:0 auto;width:100%}
body.land #rk-list{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-content:start}
body.land #rk-list .foot{grid-column:1/-1}
/* 我的: two columns */
body.land #my-body{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"h h" "p m1" "b m1" "s m2" "s m2" "f f";column-gap:4px;align-content:start}
body.land #my-body>.hdr{grid-area:h}body.land #my-body>.prof{grid-area:p}body.land #my-body>.balcard{grid-area:b}body.land #my-body>.stats{grid-area:s;align-self:start}
body.land #my-body>.menu:nth-child(5){grid-area:m1}body.land #my-body>.menu:nth-child(6){grid-area:m2;align-self:start}body.land #my-body>.foot{grid-area:f}
body.land #my-body .menu{margin-top:10px}
body.land #my-body .menu>button{padding:11px 14px}
/* sub pages */
body.land #rc-list,body.land #as-list{display:grid;grid-template-columns:1fr 1fr;column-gap:0;align-content:start}
body.land #rc-list .empty,body.land #as-list .empty{grid-column:1/-1}
body.land #set-body{columns:2;column-gap:0;display:block}
body.land #set-body .menu{break-inside:avoid;margin-top:0;margin-bottom:12px;display:inline-block;width:calc(100% - 28px)}
body.land #set-body .foot{column-span:all}

/* ===== AVA D-Eco brand: navy + chrome violet/blue accents (gold kept for AVA currency) ===== */
:root{--vio:#8b6cff;--vio2:#5b7cff;--chrome:linear-gradient(135deg,#f4f6ff 0%,#b9c3ff 28%,#7c5cff 58%,#4d7dff 78%,#d38bff 100%);--vline:rgba(139,108,255,.38)}
#app{background:radial-gradient(90% 45% at 85% -5%,rgba(124,92,255,.28),transparent 60%),radial-gradient(120% 55% at 10% -5%,#1f2f66 0%,#0e1634 46%,#070b19 100%)}
.btn{background:linear-gradient(180deg,#8a7bff,#5a4fe0 55%,#3e3bb8);box-shadow:0 3px 0 #2a2585,0 6px 14px rgba(70,60,200,.3)}
.btn.ghost{border-color:var(--vline);color:#e3e0ff}
#tabbar{border-top-color:var(--vline)}
#tabbar button.on{color:#c4b5ff}
#tabbar button.on svg{filter:drop-shadow(0 0 7px rgba(139,108,255,.85))}
body.land #tabbar{border-right-color:var(--vline)}
body.land #tabbar button.on{background:rgba(139,108,255,.14)}
.hdr h2{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec{color:#dcd6ff}
.sec:before{content:'';display:inline-block;width:3px;height:13px;border-radius:2px;margin-right:7px;background:linear-gradient(#b39cff,#4d7dff);vertical-align:-1px}
.sec{justify-content:flex-start}.sec small{margin-left:auto}
.seg button.on{background:linear-gradient(180deg,rgba(139,108,255,.32),rgba(77,125,255,.1));border-color:var(--vline);color:#efeaff}
.gcard.sel{border-color:#a48cff;box-shadow:0 0 0 2px rgba(139,108,255,.4),0 10px 24px rgba(0,0,0,.35)}
.tier.sel{border-color:#a48cff;background:linear-gradient(160deg,rgba(139,108,255,.26),rgba(77,125,255,.06));box-shadow:0 0 14px rgba(139,108,255,.3)}
.modal{border-color:rgba(150,125,255,.5)}
.modal h3{color:#e6e0ff}
.marq{background:rgba(139,108,255,.08);border-color:rgba(139,108,255,.22);color:#e6defd}
.menu .grp{color:#b9a8ff}
.sw.on{background:linear-gradient(90deg,#5b6bff,#a07bff)}
.segm{border-color:var(--vline)}.segm button.on{background:linear-gradient(90deg,#6c5cff,#9a7bff);color:#fff}
input[type=range]{background:linear-gradient(90deg,#9a7bff var(--p,50%),#3a4159 var(--p,50%))}
/* brand bar (lobby header) */
.brandbar{display:flex;align-items:center;gap:6px;padding:10px 16px 0}
.brandbar .bm{width:30px;height:30px;background:var(--bmark) center/contain no-repeat;filter:drop-shadow(0 0 6px rgba(139,108,255,.55))}
.brandbar .bw{width:96px;height:13px;background:var(--bword) left center/contain no-repeat}
.brandbar .bt{margin-left:4px;font-size:11px;color:#a9a3d6;letter-spacing:2px;padding-left:8px;border-left:1px solid rgba(255,255,255,.15)}
.lh{padding-top:6px}
/* splash */
#splash{background:radial-gradient(60% 40% at 50% 42%,rgba(124,92,255,.35),transparent 70%),radial-gradient(circle at 50% 40%,#1c2858,#060a18 72%)}
#splash .logo{width:250px;height:179px;background:var(--bfull) center/contain no-repeat;animation:brandIn 1s cubic-bezier(.2,.9,.3,1) both,brandGlow 2.4s ease-in-out .9s infinite;position:relative;-webkit-mask:var(--bfull) center/contain no-repeat;mask:var(--bfull) center/contain no-repeat}
#splash .logo:after{content:'';position:absolute;inset:-10%;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);transform:translateX(-120%);animation:shine 2.4s ease-in-out .6s infinite}
#splash .glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,255,.45),transparent 65%);top:calc(50% - 190px);left:calc(50% - 130px);animation:gpulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes brandIn{from{opacity:0;transform:scale(.86) translateY(10px)}}
@keyframes brandGlow{50%{filter:brightness(1.12)}}
@keyframes shine{55%,100%{transform:translateX(120%)}}
@keyframes gpulse{50%{transform:scale(1.12);opacity:.75}}
#splash h1{font-size:18px;letter-spacing:10px;margin-top:16px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .bar i{background:linear-gradient(90deg,#5b7cff,#c9b8ff)}
/* about card (我的) */
.about{margin:12px 14px 0;padding:16px;border-radius:18px;text-align:center;background:radial-gradient(70% 90% at 50% 0%,rgba(124,92,255,.25),transparent 70%),var(--glass);border:1px solid var(--vline)}
.about .bf{width:150px;height:107px;margin:0 auto 8px;background:var(--bfull) center/contain no-repeat;filter:drop-shadow(0 6px 18px rgba(124,92,255,.45))}
.about p{font-size:11.5px;color:#a9b3d1;line-height:1.6}
.about b{color:#e6e0ff}
/* result watermark */
.modal.result{position:relative}
.modal.result:before{content:'';position:absolute;right:-30px;bottom:-30px;width:220px;height:220px;background:var(--bmark2) center/contain no-repeat;opacity:.07;pointer-events:none;transform:rotate(-8deg)}
.modal.result>*{position:relative}

/* ===== v7 麻将桌：所有弃牌/副露正面朝向自己，按座位分区，自动缩放，互不遮挡 ===== */
.mjmid{min-height:0;overflow:hidden}
.mjside{min-height:0;overflow:hidden}
.ohand.v .tile{margin-top:-6px}
.mjc{grid-template-rows:auto minmax(0,1fr) auto;min-height:0;overflow:hidden;--rt:17px;position:relative}
.river{gap:2px;min-width:0;min-height:0;overflow:hidden;padding:2px}
.river .tile.sm,body.land .river .tile.sm{width:var(--rt);height:calc(var(--rt)*1.4);border-radius:2px;flex:none}
.rv2,body.land .rv2{transform:none;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;min-height:0}
.rv0,body.land .rv0{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;min-height:0}
.rv3,.rv1,body.land .rv3,body.land .rv1{display:flex;flex-wrap:wrap;align-content:center;direction:ltr;grid-template-rows:none}
.rv3{justify-content:flex-end}.rv1{justify-content:flex-start}
.river .tile.last::after,.rv2 .tile.last::after{display:none}
.river .tile.last{box-shadow:0 0 0 2px #ff5252,0 0 9px 2px rgba(255,82,82,.9);z-index:2;animation:lastp .9s ease-in-out infinite alternate}
@keyframes lastp{from{box-shadow:0 0 0 2px #ff5252,0 0 4px 1px rgba(255,82,82,.6)}to{box-shadow:0 0 0 2px #ffd34d,0 0 11px 3px rgba(255,82,82,.95)}}
.river .tile.sm{position:relative}
/* landscape: action buttons get their own column, never over the table */
body.land .mjmy{grid-template-columns:auto auto 1fr auto}
body.land #mj-acts{position:static;grid-column:4;grid-row:1;align-self:end;display:flex;flex-direction:column;flex-wrap:wrap-reverse;max-height:96px;gap:5px;margin:0 0 6px;padding-right:env(safe-area-inset-right);align-content:flex-end}
body.land #mj-acts:empty{display:none}
body.land #mj-acts .btn{margin:0;white-space:nowrap}
#sc-mj~.bubble,.bubble{max-width:150px}
#sc-mj .topbar{position:relative}
#mj-chatline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);max-width:min(62%,420px);padding:5px 12px;border-radius:14px;background:#fff;color:#1b2140;font-size:12.5px;line-height:1.3;box-shadow:0 4px 12px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#mj-chatline.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#mj-chatline.emo{font-size:22px;padding:2px 12px}
.mjside>*{flex-shrink:0}
body.land .mjside{position:relative;padding-bottom:4px}
body.land .mjside>.role{position:absolute;top:2px;left:calc(50% + 16px);margin:0;z-index:2}
body.lshort .mjside .av{width:38px;height:38px;font-size:22px}
body.lshort .mjside{gap:2px;font-size:11px}
body.lshort .mjside .melds .tile.xs{width:14px;height:20px}
body.lshort .mjside .melds{gap:2px}
#sc-mj .topbar.chat .tinfo{opacity:0;transition:opacity .2s}

/* ===== v8 ===== */
.avam{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle;gap:0}
.avam .an{font-variant-numeric:tabular-nums}
.avam .au{font-size:.7em;margin-left:3px;font-weight:800;letter-spacing:.4px;color:#f3c969;background:linear-gradient(180deg,#ffe9a8,#d9a440);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.95}
.pos .avam .au,.neg .avam .au{-webkit-text-fill-color:#f3c969}
#sndban{top:calc(6px + env(safe-area-inset-top))!important;bottom:auto!important;left:50%!important;transform:translateX(-50%)!important;font-size:11px!important;padding:3px 10px!important;border-radius:12px!important;opacity:.9;z-index:120;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35)!important}
.av{position:relative}
.aic{position:absolute;right:-3px;bottom:-3px;font-size:8px;line-height:1;font-weight:800;padding:2px 3px;border-radius:5px;background:rgba(20,24,48,.85);color:#9fb4ff;border:1px solid rgba(159,180,255,.45);letter-spacing:.3px;font-style:normal}
.aitag{display:inline-block;margin-left:4px;font-size:9px;padding:0 4px;border-radius:4px;background:rgba(159,180,255,.16);color:#9fb4ff;vertical-align:middle}
/* level */
.lvb{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 6px;border-radius:9px;background:linear-gradient(135deg,#6d4dff,#2e6bff);color:#fff;font-size:11px;vertical-align:middle;box-shadow:0 0 8px rgba(109,77,255,.45)}
.lvb b{font-weight:900;letter-spacing:.3px}
.lvb i{display:inline-block;width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
.lvb i:after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p);background:#ffe08a}
.xpbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 2px}
.xpbar.big{height:8px;border-radius:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8b6cff,#4dd0ff);border-radius:inherit}
.lvcard{display:flex;gap:12px;align-items:center;margin:10px 14px 0;padding:12px;border-radius:16px}
.lvbig{width:62px;height:62px;border-radius:16px;background:linear-gradient(145deg,#7b5cff,#2e6bff);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(80,90,255,.4)}
.lvbig b{font-size:19px;font-weight:900}.lvbig small{font-size:10px;opacity:.9}
.lvrow{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);gap:6px;flex-wrap:wrap}
.lvrow.sm{font-size:10.5px;margin-top:4px}.lvrow .ok{color:#7df0b0}.lvrow .lk{color:#ffb38a}
.lvup{position:absolute;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(5,8,25,.55);animation:fadeIn .25s}
.lvup.out{transition:opacity .5s;opacity:0}
.lvup .rays{position:absolute;width:420px;height:420px;background:repeating-conic-gradient(rgba(255,224,138,.22) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 6s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.lvup .lvc{position:relative;text-align:center;padding:22px 34px;border-radius:22px;background:linear-gradient(160deg,#3a2c8f,#151a45);border:2px solid #f3c969;box-shadow:0 0 40px rgba(243,201,105,.5);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.lvup small{display:block;letter-spacing:4px;color:#ffe08a;font-weight:800}
.lvup b{display:block;font-size:52px;font-weight:900;background:linear-gradient(180deg,#fff6d0,#f3c969);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lvup span{display:block;color:#cfc6ff}.lvup em{display:block;margin-top:8px;font-style:normal;color:#7df0b0;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}}
.tier.locked{opacity:.78;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px),var(--glass)}
.tier.locked b{color:#ffcf9a}.tier.locked .xpbar{margin:4px 6px 2px}
/* lobby 4 games */
.games .gcard{height:136px}
body.land .games .gcard{height:118px}body.lwide .games .gcard{height:160px}
.g3{background:radial-gradient(circle at 70% 30%,rgba(120,190,255,.45),transparent 60%),linear-gradient(150deg,#1f5fbf,#0a1d4a)}
.g4{background:radial-gradient(circle at 70% 30%,rgba(255,140,240,.45),transparent 60%),linear-gradient(150deg,#c23bd0,#4a1478)}
.newb{position:absolute;left:10px;top:10px;font-size:9px;font-weight:900;padding:1px 6px;border-radius:6px;background:linear-gradient(135deg,#ff5f6d,#ffc371);color:#fff;letter-spacing:.5px;z-index:2}
.gcard .gt{font-size:21px;bottom:24px}.gcard .gs{bottom:8px}
.bart{position:absolute;right:30px;top:34px;width:60px;height:60px}
.bb{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 30%),var(--c);box-shadow:0 4px 8px rgba(0,0,0,.45);font-style:normal;font-size:9px;font-weight:900;color:#111;display:flex;align-items:center;justify-content:center}
.bb:before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;z-index:-0}
.bb{z-index:1}.bb.st{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 30%),linear-gradient(#f7f5ee 22%,var(--c) 22% 78%,#f7f5ee 78%)}
.bb{text-indent:0}.bb{isolation:isolate}.bb:before{z-index:-1}
.bart .cue{position:absolute;left:-60px;top:52px;width:80px;height:4px;border-radius:2px;background:linear-gradient(90deg,#2a1405,#b07a3c 70%,#e9d3a0 92%,#3a7bd5 95%,#f4f0e6);transform:rotate(-24deg);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.m3art{position:absolute;right:16px;top:30px;display:grid;grid-template-columns:repeat(3,24px);gap:3px;transform:rotate(-8deg)}
.m3art .gem{width:24px;height:24px;transform:none!important}
/* matchmaking */
#sc-match{background:radial-gradient(ellipse at 50% 30%,#2c2a7a,#0b1230 70%)}
.mmwrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.mmt{font-size:20px;font-weight:900;letter-spacing:3px}.mmf{font-size:12px;color:var(--txt2);margin-top:4px}
.mmring{position:relative;width:120px;height:120px;margin:22px 0 10px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mmring .spin{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.1);border-top-color:#f3c969;border-right-color:#8b6cff;animation:spin 1s linear infinite}

.gem.fz.sel>i{animation:fsel .5s ease-in-out infinite alternate!important;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 3px #fff)}
.gem.fz.sel:before{content:'';position:absolute;inset:2px;border-radius:24%;border:2.5px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.9),inset 0 0 10px rgba(255,255,255,.5)}
@keyframes fsel{from{transform:scale(1.04)}to{transform:scale(1.14)}}
.gem.fz.pop>i{animation:fpop .26s ease-in forwards!important}
@keyframes fpop{0%{transform:scale(1)}35%{transform:scale(1.28);filter:brightness(1.6) drop-shadow(0 0 10px #fff)}100%{transform:scale(.1);opacity:0}}
.gem.fz.born>i{animation:fborn .38s cubic-bezier(.3,1.6,.5,1)!important}
@keyframes fborn{from{transform:scale(.2);opacity:.2}to{transform:scale(1);opacity:1}}
.jd{position:absolute;width:calc(var(--cs,40px)*.2);height:calc(var(--cs,40px)*.2);margin:calc(var(--cs,40px)*-.1);border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--jc) 45%);pointer-events:none;z-index:6;animation:jfly .55s cubic-bezier(.2,.7,.4,1) forwards;transform:scale(var(--s))}
@keyframes jfly{0%{transform:translate(0,0) scale(var(--s)) rotate(0);opacity:1}70%{opacity:.9}100%{transform:translate(var(--dx),calc(var(--dy) + 18px)) scale(calc(var(--s)*.3)) rotate(200deg);opacity:0}}
.jring{position:absolute;width:calc(var(--cs,40px)*.9);height:calc(var(--cs,40px)*.9);margin:calc(var(--cs,40px)*-.45);border-radius:50%;border:3px solid var(--jc);box-shadow:0 0 12px var(--jc),inset 0 0 8px rgba(255,255,255,.7);pointer-events:none;z-index:5;animation:jring .5s ease-out forwards}

.m3combo b{font-size:54px;font-weight:900;background:linear-gradient(#ffffff,#ffd1f0 45%,#ff5fb0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #6a2cff) drop-shadow(0 0 14px rgba(255,120,200,.8))}
.m3combo span{font-size:18px;font-weight:900;color:#fff;-webkit-text-stroke:1px #6a2cff;text-shadow:0 2px 0 #6a2cff}

.m3fx.fx-bomb,.m3fx.fx-rainbow{background:radial-gradient(circle,#fff,rgba(255,240,170,.75) 35%,rgba(255,120,200,.3) 55%,transparent 70%)}

#l-car .slide{height:auto!important;aspect-ratio:1200/393}

/* rarity system */
.r0{--rc:#9aa7bd;--rc2:#5d6a80;--rg:rgba(154,167,189,.25)}.r1{--rc:#4fb2ff;--rc2:#1d5fd6;--rg:rgba(79,178,255,.45)}.r2{--rc:#c07bff;--rc2:#7a2df0;--rg:rgba(192,123,255,.55)}.r3{--rc:#ffd36a;--rc2:#ff8a1f;--rg:rgba(255,196,80,.65)}
.sitem{border-radius:18px;padding:8px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(10,12,30,.35));-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);border:1px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px var(--rc2) inset,0 0 18px var(--rg),0 10px 22px rgba(0,0,0,.35);isolation:isolate}
.sitem::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,var(--rc),rgba(255,255,255,.15) 35%,var(--rc2) 60%,var(--rc));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.sitem.r2::after,.sitem.r3::after{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.22) 50%,transparent 56%);animation:shsweep 4.5s ease-in-out infinite;pointer-events:none;z-index:2}
.sitem.r3::after{animation-duration:3.2s;background:linear-gradient(115deg,transparent 43%,rgba(255,240,200,.32) 50%,transparent 57%)}
@keyframes shsweep{0%,50%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.sitem .pv{height:118px;border-radius:13px;overflow:visible;background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%),radial-gradient(ellipse at 50% 120%,var(--rg),transparent 60%),linear-gradient(#141833,#070915);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -12px 20px rgba(0,0,0,.4)}
.sitem .pv{overflow:hidden}
.sitem .nm{font-size:14px;font-weight:900;margin-top:8px;letter-spacing:.5px;background:linear-gradient(#fff,var(--rc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sitem.r0 .nm{background:none;color:#e8edf6}
.rar{top:12px;left:12px;font-size:10px;letter-spacing:1px;padding:2px 8px;border-radius:9px;background:linear-gradient(135deg,var(--rc),var(--rc2));box-shadow:0 0 10px var(--rg),0 2px 6px rgba(0,0,0,.35);text-shadow:0 1px 1px rgba(0,0,0,.35)}
.sitem .pv .av.fr{margin:0}
.pcard{border:none;border-radius:8px;box-shadow:0 8px 16px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18)}
.pcard::before{display:none}
.pcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 60%);background-size:250% 100%;animation:pcsh 3.8s ease-in-out infinite}
@keyframes pcsh{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.pfelt{box-shadow:inset 0 0 0 3px #3b2414,inset 0 0 0 5px #c8963e,inset 0 0 0 7px #2a170b,inset 0 10px 24px rgba(0,0,0,.55)}
.pemo{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.75),rgba(255,255,255,.08) 32%,rgba(255,255,255,0) 50%),radial-gradient(circle at 50% 60%,var(--rg),rgba(20,20,50,.6) 70%),linear-gradient(160deg,var(--rc),var(--rc2));box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 0 4px var(--rc2),0 0 22px var(--rg),inset 0 -8px 14px rgba(0,0,0,.35);text-shadow:0 4px 8px rgba(0,0,0,.4)}
.modal .sitem .pemo{width:120px;height:120px;font-size:64px}
.cback{border:1.5px solid rgba(255,255,255,.85);background-size:100% 100%!important}

 *   history():    GET  https://<ava-ecosystem>/v1/wallet/ledger

 * AI opponents' balances are simulated locally and never go through this adapter. */

};

/* ================= ECONOMY (v8): only REAL players pay into the pot =================
 * pot = fee × (number of real players). AI/机器人 seats pay nothing and win nothing.
 * 50% of the pot is always burned; the other 50% is split (floor) over ALL seats of the winning side; shares that fall
 * on AI seats are burned (backend v2 rule). If only AI won, that 50% is burned too. Remainders are burned.
 * 1 real + AI, tier 10/50/100: ddz landlord win 5/25/50, farmers win 2/12/25, mj hu 5/25/50, mj draw refund 5/25/50, 台球 5/25/50. */
const isReal=p=>!!p&&!p.ai;
function realSplit(pl,fee,winners){
 const realIdx=pl.map((p,i)=>i).filter(i=>isReal(pl[i]));const pot=fee*realIdx.length;
 const prize=Math.floor(pot*WIN_SHARE);const rw=(winners||[]).filter(i=>isReal(pl[i]));
 const each=rw.length?Math.floor(prize/(winners||[]).length):0,paid=each*rw.length; // split over ALL winning seats; AI seats' shares are burned
 const gain=pl.map((p,i)=>rw.includes(i)?each:0);
 return {pot,prize,each,paid,rem:rw.length?prize-paid:0,aiShare:rw.length?each*((winners||[]).length-rw.length):0,winN:(winners||[]).length,burned:pot-paid,aiWin:!rw.length,gain,realN:realIdx.length,realW:rw.length};
}
function realRefund(pl,fee){ // 麻将流局: 50% burned, 50% refunded equally to real players (floor, remainder burned)
 const realIdx=pl.map((p,i)=>i).filter(i=>isReal(pl[i]));const pot=fee*realIdx.length;
 const each=realIdx.length?Math.floor(pot*(1-WIN_SHARE)/realIdx.length):0;
 return {pot,each,gain:pl.map((p,i)=>isReal(p)?each:0),burned:pot-each*realIdx.length,realN:realIdx.length};
}
function chargeEntry(pl,fee,note){pl.forEach(p=>{if(isReal(p))addBal(p,-fee,'entry',{note})})}
function econLines(game,fee){ // human-readable payout lines for 1 real player (this test build)
 const me=[{me:true}],ai={ai:true};
 const pl=game==='ddz'?[me[0],ai,ai]:game==='mj'?[me[0],ai,ai,ai]:[me[0],ai];
 const w=realSplit(pl,fee,[0]),l=realSplit(pl,fee,[1]),f=game==='ddz'?realSplit(pl,fee,[0,1]):w;
 return {pot:w.pot,win:w.each,burnW:w.burned,burnL:l.burned,farm:f.each,burnF:f.burned};
}

function cnts(cards){const m={};for(const c of cards){const r=rk(c);m[r]=(m[r]||0)+1}return m}
function cardHTML(c,cls){

}
function rowHTML(cards,width,cw,cls){

const isSeq=a=>{for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)return false;return a[a.length-1]<=14};
function runs(list,k){const s=new Set(list),out=[];for(let e=14;e-k+1>=3;e--){let ok=true;for(let r=e-k+1;r<=e;r++)if(!s.has(r)){ok=false;break}if(ok)out.push(e)}return out}
function parseAll(cards){
 const n=cards.length,out=[];if(!n)return out;
 const m=cnts(cards),rs=Object.keys(m).map(Number).sort((a,b)=>a-b);
 const by=k=>rs.filter(r=>m[r]===k);
 const P=(t,mm)=>out.push({t,m:mm,n});
 if(n===1)P('single',rs[0]);
 if(n===2){if(m[16]&&m[17])P('rocket',17);else if(rs.length===1)P('pair',rs[0])}
 if(n===3&&rs.length===1)P('triple',rs[0]);
 if(n===4){if(rs.length===1)P('bomb',rs[0]);else if(by(3).length===1)P('triple1',by(3)[0])}
 if(n===5&&by(3).length===1&&by(2).length===1)P('triple2',by(3)[0]);
 if(n===6&&by(4).length===1)P('four2',by(4)[0]);
 if(n===8&&by(4).length===1&&by(2).length===2)P('four22',by(4)[0]);
 if(n>=5&&rs.length===n&&isSeq(rs))P('straight',rs[n-1]);
 if(n>=6&&by(2).length===rs.length&&isSeq(rs))P('pairs',rs[rs.length-1]);
 if(n>=6&&by(3).length===rs.length&&isSeq(rs))P('plane',rs[rs.length-1]);
 const tri=rs.filter(r=>m[r]>=3&&r<=14);
 if(n%4===0&&n>=8){const k=n/4;const rr=runs(tri,k);if(rr.length)P('plane1',rr[0])}
 if(n%5===0&&n>=10){const k=n/5;for(const e of runs(tri,k)){const mm={...m};for(let r=e-k+1;r<=e;r++)mm[r]-=3;if(Object.values(mm).every(v=>v%2===0)){P('plane2',e);break}}}

}

function bilFit(){
 const w=$('#bl-cvw'),cv=$('#bl-cv');if(!w||!cv)return;const W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;
 const port=H>W*1.02,rail=7;const tl=port?BT.W:BT.L,tw=port?BT.L:BT.W;
 const m=port?8:3,s=Math.min((W-m)/(tl+rail*2*1.6),(H-m)/(tw+rail*2*1.6));
 const dpr=Math.min(2.5,window.devicePixelRatio||1)*(APPF||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
 B.view={W,H,port,s,dpr,ox:(W-tl*s)/2,oy:(H-tw*s)/2};
}
function b2s(x,y){const v=B.view;return v.port?[v.ox+y*v.s,v.oy+(BT.L-x)*v.s]:[v.ox+x*v.s,v.oy+y*v.s]}
function s2b(X,Y){const v=B.view;return v.port?[BT.L-(Y-v.oy)/v.s,(X-v.ox)/v.s]:[(X-v.ox)/v.s,(Y-v.oy)/v.s]}
function sAng(a){return B.view.port?Math.atan2(-Math.cos(a),Math.sin(a)):a} // table angle → screen angle
function bRay(g,ox,oy,dx,dy){ // first hit along ray from cue: ball or cushion
 const R=BT.R;let best={t:1e9};
 for(const b of g.balls){if(!b.on||b.n===0)continue;const fx=ox-b.x,fy=oy-b.y,bq=fx*dx+fy*dy,cq=fx*fx+fy*fy-4*R*R,disc=bq*bq-cq;if(disc<0)continue;const t=-bq-Math.sqrt(disc);if(t>0&&t<best.t)best={t,b}}
 const tx=dx>0?(BT.L-R-ox)/dx:dx<0?(R-ox)/dx:1e9,ty=dy>0?(BT.W-R-oy)/dy:dy<0?(R-oy)/dy:1e9;const tc=Math.min(tx,ty);
 if(tc<best.t)best={t:tc,cush:tx<ty?'x':'y'};return best}

 const g=B.g,cv=$('#bl-cv');if(!g||!cv||!B.view)return;const v=B.view,ctx=cv.getContext('2d'),s=v.s;

 // rails (wood) + cushions

 rr(ctx,L-rw*1.6,T-rw*1.6,Wd+rw*3.2,Hd+rw*3.2,rw*1.1);ctx.fillStyle=wood;ctx.fill();
 ctx.strokeStyle='rgba(243,201,105,.55)';ctx.lineWidth=1.2;ctx.stroke();
 const t=item('table',S.equip.table);const fg=ctx.createRadialGradient(L+Wd/2,T+Hd/2,10,L+Wd/2,T+Hd/2,Math.max(Wd,Hd)*.7);fg.addColorStop(0,t.v[0]);fg.addColorStop(1,t.v[1]);
 ctx.fillStyle=shade(t.v[1],-0.15);ctx.fillRect(L-rw*.55,T-rw*.55,Wd+rw*1.1,Hd+rw*1.1);
 ctx.fillStyle=fg;ctx.fillRect(L,T,Wd,Hd);
 // diamonds + head string
 ctx.fillStyle='rgba(255,236,190,.8)';for(let i=1;i<8;i++){if(i===4)continue;const [a,b]=b2s(BT.L*i/8,-5.2),[c,d]=b2s(BT.L*i/8,BT.W+5.2);dot(ctx,a,b,1.6);dot(ctx,c,d,1.6)}

 {const [a,b]=b2s(BT.L*0.75,BT.W/2);dot(ctx,a,b,1.4)}

 // aim guide

 if(c.on&&g.phase==='play'&&!B.moving){

  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(bx,by,BT.R*s,0,7);ctx.stroke();

   let tx=dx-ux*cosA,ty=dy-uy*cosA;const tl=Math.hypot(tx,ty)||1;const [r1,s1]=b2s(hx+tx/tl*30*(1-cosA)+tx/tl*3,hy+ty/tl*30*(1-cosA)+ty/tl*3);ctx.strokeStyle='rgba(160,220,255,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(r1,s1);ctx.stroke();

  else if(h.cush&&my){const rx=h.cush==='x'?-dx:dx,ry=h.cush==='y'?-dy:dy;const [r1,s1]=b2s(hx+rx*25,hy+ry*25);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(r1,s1);ctx.stroke();ctx.setLineDash([])}
  // cue stick
  const sa=sAng(B.aim),pull=8+(B.pow||0)*40;const cx0=ax-Math.cos(sa)*(BT.R*s+pull),cy0=ay-Math.sin(sa)*(BT.R*s+pull),len=Math.min(v.W,v.H)*0.55;
  const cg=ctx.createLinearGradient(cx0,cy0,cx0-Math.cos(sa)*len,cy0-Math.sin(sa)*len);cg.addColorStop(0,'#f4f0e6');cg.addColorStop(.03,'#3a7bd5');cg.addColorStop(.06,'#e9d3a0');cg.addColorStop(.7,'#b07a3c');cg.addColorStop(1,'#2a1405');

 }
 // balls
 for(const b of g.balls){if(!b.on)continue;const [X,Y]=b2s(b.x,b.y);drawBall(ctx,X,Y,BT.R*s,b.n)}
 if(g.bih&&g.turn===0&&!B.auto&&!DBG.auto&&g.phase==='play'&&!B.moving){const [X,Y]=b2s(c.x,c.y);ctx.strokeStyle='rgba(120,255,170,.9)';ctx.setLineDash([3,3]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X,Y,BT.R*s+6,0,7);ctx.stroke();ctx.setLineDash([])}
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+k))));return `rgb(${f(r)},${f(g)},${f(b)})`}
function drawBall(ctx,X,Y,r,n){

 if(n){ctx.fillStyle='#fff';dot(ctx,X,Y,r*.48);ctx.fillStyle='#111';ctx.font=`800 ${Math.max(6,r*.62)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,X,Y+r*.03)}

/* ================= 水果消消乐 · fruit sprites =================
 * Each fruit is painted once with Canvas 2D (gradients, specular highlights, soft shadows) at 2× cell size,
 * then reused as a bitmap (data URL) for every piece → cheap to animate with CSS transforms.
 * Variants per fruit: normal · rh/rv (横/竖 火箭：glossy stripes) · bomb (glowing aura). Plus the rainbow piece. */
const FRUITS=[{k:'strawberry',n:'草莓',c:'#ff3b5c'},{k:'orange',n:'橙子',c:'#ff9a1f'},{k:'lemon',n:'柠檬',c:'#ffd60a'},{k:'apple',n:'青苹果',c:'#7ed321'},{k:'blueberry',n:'蓝莓',c:'#3d6bff'},{k:'grape',n:'葡萄',c:'#a34bff'}];
const FS={img:[],ready:false,S:128};
function fsCanvas(S){const c=document.createElement('canvas');c.width=c.height=S;return c}
function rg(x,cx,cy,r0,fx,fy,r1,stops){const g=x.createRadialGradient(fx,fy,r0,cx,cy,r1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function lg(x,x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}

/* ================= 消消乐 (single-player match-3) =================
 * 8×8 board, 6 gem colours. Specials: 4 in a line → 火箭 (clears its row/column), L/T → 炸弹 (3×3), 5 in a line → 彩虹 (clears one colour).
 * Modes: 免费练习 (3/day, no AVA either way) · 挑战赛 (fee per tier, fixed moves, same seeded board for everyone per tier per day).
 * Daily pool per tier = all entry fees. Settlement 00:00 Asia/Shanghai: 50% burned, 50% to top 10% (linear weights, floor, remainder burned; <10 players → top 1). */
const M3_CFG={size:8,colors:6,moves:30,freePerDay:3,attemptsPerDay:5,winnerPct:0.10,minPlayersForPct:10,
 boosters:{moves:{id:'k1',name:'+5步',ic:'➕',price:5,desc:'本局步数 +5'},hammer:{id:'k2',name:'锤子',ic:'🔨',price:8,desc:'敲碎任意一颗宝石（不耗步数）'},shuffle:{id:'k3',name:'重排',ic:'🔀',price:6,desc:'重新排列棋盘（不耗步数）'}}, // ids/prices = backend shop items k1/k2/k3
 simPlayers:[34,16,8]};
const GEMS=FRUITS.map(f=>f.c);
const GEMI=['♥','★','♣','◆','●','▲'];
/* ---- Asia/Shanghai day helpers ---- */
const SH_OFF=8*3600e3;
function shKey(t){const d=new Date((t||Date.now())+SH_OFF);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function shMsLeft(t){t=t||Date.now();return 86400e3-((t+SH_OFF)%86400e3)}
function shDayFrac(t){t=t||Date.now();return ((t+SH_OFF)%86400e3)/86400e3}
function shPrev(k){const [y,m,d]=k.split('-').map(Number);return shKey(Date.UTC(y,m-1,d)-SH_OFF-3600e3)}
function hms(ms){const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s/60)%60)+':'+p(s%60)}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---- persistent state ---- */
function m3S(){if(!S.m3)S.m3={prac:{d:'',n:0},inv:{moves:0,hammer:0,shuffle:0},rounds:{},settled:{},last:null,round:{d:'',k:0}};
 const r=S.m3.round;const k=shKey();if(r.d!==k){r.d=k;r.k=0}return S.m3}
function m3RoundId(){const r=m3S().round;return r.d+(r.k?'#'+r.k:'')}
function m3Round(id,ri){const R=m3S().rounds;R[id]=R[id]||{};R[id][ri]=R[id][ri]||{mine:[]};return R[id][ri]}
/* simulated rivals for a round+tier (deterministic, clearly labelled 模拟) */
function m3Sims(id,ri){
 const rng=mulberry(hashStr('sim|'+id+'|'+ri)),n=M3_CFG.simPlayers[ri]+Math.floor(rng()*8);const out=[];
 const names=RIVAL_N.map(x=>x[0]).concat(['消除大王','糖果控','连击王','宝石猎人','星星眼','小确幸','一步到位','萌新上路','闪电侠','彩虹桥','慢慢来','步步高']);
 for(let i=0;i<n;i++){const att=1+Math.floor(rng()*2.2);const base=2200+rng()*3800+ri*500;const sc=Math.round((base+(rng()+rng()+rng()-1.5)*1400)/10)*10;
  out.push({name:names[i%names.length]+(i>=names.length?Math.floor(i/names.length)+1:''),av:pick2(rng,AVATARS),score:Math.max(300,sc),att,t:rng(),sim:true})}
 return out;
}
function pick2(r,a){return a[Math.floor(r()*a.length)]}
function m3Board(id,ri,cut){ // leaderboard entries (best per player); cut=true → only sims that have "entered" by now (today)
 const R=m3Round(id,ri),fr=id.startsWith(shKey())&&cut?shDayFrac():1;
 const L=m3Sims(id,ri).filter(p=>p.t<=fr);
 if(R.mine.length){const best=R.mine.reduce((a,b)=>b.score>a.score?b:a);L.push({name:S.name,av:S.av,score:best.score,att:R.mine.length,me:true,boosts:R.mine.reduce((a,m)=>a+(m.boosts||[]).length,0),t:best.t})}
 return L.sort((a,b)=>b.score-a.score||(a.t-b.t));
}
function m3Payout(n,dist){ // returns per-rank prizes for top k
 const k=n>=M3_CFG.minPlayersForPct?Math.max(1,Math.floor(n*M3_CFG.winnerPct)):1;let sw=0;for(let i=0;i<k;i++)sw+=k-i;
 const pr=[];for(let i=0;i<k;i++)pr.push(Math.floor(dist*(k-i)/sw));return {k,pr,paid:pr.reduce((a,b)=>a+b,0)};
}
function m3PoolOf(id,ri,cut){const L=m3Board(id,ri,cut);const fee=ROOMS[ri].fee;const ab=m3Round(id,ri).ab||0;return {L,n:L.length,pool:L.reduce((a,p)=>a+p.att*fee,0)+ab*fee,ab}}
function m3Settle(id){
 const st=m3S();if(st.settled[id])return st.settled[id];
 const res={id,t:Date.now(),tiers:[]};
 for(let ri=0;ri<3;ri++){const {L,n,pool}=m3PoolOf(id,ri,false);if(!n)continue;
  const dist=Math.floor(pool*WIN_SHARE),pay=m3Payout(n,dist),burned=pool-pay.paid;const myRank=L.findIndex(p=>p.me);const myPrize=myRank>=0&&myRank<pay.k?pay.pr[myRank]:0;
  const mine=m3Round(id,ri).mine,myN=mine.length+(m3Round(id,ri).ab||0);
  if(myPrize)Wallet.credit(myPrize,'m3prize',{note:`消消乐挑战赛 · ${ROOMS[ri].name} · ${id} 第 ${myRank+1} 名奖励`});
  if(myN){Wallet.note('burn',{note:`消消乐挑战赛 · ${ROOMS[ri].name} · ${id} 日结算奖池销毁`,burn:burned});S.burned+=Math.round(burned*myN*ROOMS[ri].fee/pool)}
  S.netBurn+=burned;
  const t={ri,n,pool,dist,k:pay.k,prizes:pay.pr,paid:pay.paid,burned,myRank,myPrize,myAtt:myN,myAbandoned:myN-mine.length,myFees:myN*ROOMS[ri].fee,top:L.slice(0,Math.max(pay.k,5)).map((p,i)=>({name:p.name,score:p.score,me:!!p.me,sim:!!p.sim,prize:i<pay.k?pay.pr[i]:0})),ok:pool===pay.paid+burned};
  if(!t.ok)DBG.errors.push('m3 settle mismatch');res.tiers.push(t)}
 st.settled[id]=res;st.last=id;delete st.rounds[id];save();DBG.m3Settled=(DBG.m3Settled||[]);DBG.m3Settled.push(res);return res;
}
function m3AutoSettle(){const st=m3S(),today=shKey();let did=null;Object.keys(st.rounds).forEach(id=>{if(id.slice(0,10)<today){did=m3Settle(id)}});if(did&&!DBG.fast&&$('#sc-m3hub').classList.contains('on'))renderM3Hub();return did}
function m3ForceSettle(){const id=m3RoundId();const r=m3Settle(id);m3S().round.k++;save();return r}

/* ---- engine ---- */
const X3={g:null,tok:0,busy:false,sel:null,hammer:false};
function m3New(seed,moves){
 const N=M3_CFG.size,rng=mulberry(seed>>>0);let id=0;const g={N,rng,moves,score:0,combo:0,maxCombo:0,cells:[],nid:()=>++id,stats:{rocket:0,bomb:0,rainbow:0,cleared:0,moves:0}};
 for(let y=0;y<N;y++){g.cells[y]=[];for(let x=0;x<N;x++){let c;do{c=Math.floor(rng()*M3_CFG.colors)}while((x>1&&g.cells[y][x-1].c===c&&g.cells[y][x-2].c===c)||(y>1&&g.cells[y-1][x].c===c&&g.cells[y-2][x].c===c));g.cells[y][x]={c,sp:null,id:g.nid()}}}
 if(!m3HasMove(g))m3Shuffle(g);return g;
}
const at=(g,x,y)=>x>=0&&y>=0&&x<g.N&&y<g.N?g.cells[y][x]:null;
function m3Runs(g){const N=g.N,runs=[];
 for(let y=0;y<N;y++){let x=0;while(x<N){const c=g.cells[y][x];if(!c||c.sp==='rainbow'){x++;continue}let e=x+1;while(e<N&&g.cells[y][e]&&g.cells[y][e].sp!=='rainbow'&&g.cells[y][e].c===c.c)e++;if(e-x>=3)runs.push({d:'h',cells:Array.from({length:e-x},(_,i)=>[x+i,y])});x=e}}
 for(let x=0;x<N;x++){let y=0;while(y<N){const c=g.cells[y][x];if(!c||c.sp==='rainbow'){y++;continue}let e=y+1;while(e<N&&g.cells[e][x]&&g.cells[e][x].sp!=='rainbow'&&g.cells[e][x].c===c.c)e++;if(e-y>=3)runs.push({d:'v',cells:Array.from({length:e-y},(_,i)=>[x,y+i])});y=e}}
 return runs}
function m3Groups(runs){const gs=[];for(const r of runs){const key=new Set(r.cells.map(([x,y])=>x+','+y));let hit=gs.filter(G=>r.cells.some(([x,y])=>G.set.has(x+','+y)));
  if(!hit.length)gs.push({set:key,runs:[r]});else{const G=hit[0];r.cells.forEach(([x,y])=>G.set.add(x+','+y));G.runs.push(r);for(const o of hit.slice(1)){o.set.forEach(k=>G.set.add(k));G.runs.push(...o.runs);gs.splice(gs.indexOf(o),1)}}}
 return gs}
function m3HasMove(g){const N=g.N;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=g.cells[y][x];if(a.sp==='rainbow')return true;for(const [dx,dy] of [[1,0],[0,1]]){const b=at(g,x+dx,y+dy);if(!b)continue;if(b.sp==='rainbow'||(a.sp&&b.sp))return true;
  g.cells[y][x]=b;g.cells[y+dy][x+dx]=a;const ok=m3Runs(g).length>0;g.cells[y][x]=a;g.cells[y+dy][x+dx]=b;if(ok)return true}}return false}
function m3Shuffle(g){const N=g.N;let tries=0;do{const all=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)all.push(g.cells[y][x]);for(let i=all.length-1;i>0;i--){const j=Math.floor(g.rng()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)g.cells[y][x]=all[y*N+x];tries++}while((m3Runs(g).length||!m3HasMove(g))&&tries<80);
 if(m3Runs(g).length||!m3HasMove(g)){for(let y=0;y<N;y++)for(let x=0;x<N;x++){let c;do{c=Math.floor(g.rng()*M3_CFG.colors)}while((x>1&&g.cells[y][x-1].c===c&&g.cells[y][x-2].c===c)||(y>1&&g.cells[y-1][x].c===c&&g.cells[y-2][x].c===c));g.cells[y][x]={c,sp:null,id:g.nid()}}}}
/* blast area for a special at (x,y) */
function m3Blast(g,x,y,cell,set,q){
 if(cell.sp==='rh'){for(let i=0;i<g.N;i++)q.push([i,y])}
 else if(cell.sp==='rv'){for(let i=0;i<g.N;i++)q.push([x,i])}
 else if(cell.sp==='bomb'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)q.push([x+dx,y+dy])}
 else if(cell.sp==='rainbow'){const col=cell.target!=null?cell.target:m3TopColor(g);for(let yy=0;yy<g.N;yy++)for(let xx=0;xx<g.N;xx++){const c=g.cells[yy][xx];if(c&&c.c===col&&c.sp!=='rainbow')q.push([xx,yy])}}
}
function m3TopColor(g){const n=new Array(M3_CFG.colors).fill(0);g.cells.forEach(r=>r.forEach(c=>{if(c&&c.sp!=='rainbow')n[c.c]++}));return n.indexOf(Math.max(...n))}
/* clear a set of positions with chain reactions; returns cleared list for animation */
function m3Clear(g,pos,keep){
 const done=new Set(),q=pos.slice(),out=[];
 while(q.length){const [x,y]=q.shift(),k=x+','+y;if(done.has(k))continue;const c=at(g,x,y);if(!c)continue;if(keep&&keep.has(k)){done.add(k);continue}done.add(k);out.push({x,y,id:c.id,sp:c.sp,c:c.c});
  if(c.sp){g.score+=c.sp==='rainbow'?300:c.sp==='bomb'?120:80;m3Blast(g,x,y,c,done,q)}g.cells[y][x]=null}
 g.stats.cleared+=out.length;g.score+=out.length*10*Math.max(1,g.combo);return out}
/* resolve matches at current board; swap=[x,y] preferred special location */
function m3Resolve(g,pref){
 const runs=m3Runs(g);if(!runs.length)return null;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
 const gs=m3Groups(runs),create=[],pos=[];
 for(const G of gs){const cells=[...G.set].map(s=>s.split(',').map(Number));const maxL=Math.max(...G.runs.map(r=>r.cells.length));const hv=new Set(G.runs.map(r=>r.d));
  let sp=null;if(maxL>=5)sp='rainbow';else if(hv.size>1)sp='bomb';else if(maxL===4)sp=G.runs[0].d==='h'?'rh':'rv';
  const prefIn=pref&&pref.find(p=>G.set.has(p[0]+','+p[1]));const loc=prefIn||cells[Math.floor(cells.length/2)];
  if(sp){const c0=at(g,loc[0],loc[1]);create.push({x:loc[0],y:loc[1],sp,c:c0.c});g.stats[sp==='rh'||sp==='rv'?'rocket':sp]++}
  cells.forEach(p=>pos.push(p))}
 const keep=new Set();
 const cleared=m3Clear(g,pos,null);
 for(const s of create){if(!g.cells[s.y][s.x]){g.cells[s.y][s.x]={c:s.sp==='rainbow'?-1:s.c,sp:s.sp,id:g.nid(),born:true};g.score+=s.sp==='rainbow'?200:s.sp==='bomb'?100:60}}
 return {cleared,create};
}
function m3Gravity(g){const N=g.N,moves=[];for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--){const c=g.cells[y][x];if(c){if(w!==y){g.cells[w][x]=c;g.cells[y][x]=null;moves.push(c.id)}w--}}
  let k=0;for(let y=w;y>=0;y--){g.cells[y][x]={c:Math.floor(g.rng()*M3_CFG.colors),sp:null,id:g.nid(),fromY:-1-(k++)}}}return moves}
function m3SwapCombo(g,a,b,ax,ay,bx,by){ // special+special or rainbow swaps (no match needed)
 const A=a.sp,Bs=b.sp;
 if(A==='rainbow'&&Bs==='rainbow'){const all=[];for(let y=0;y<g.N;y++)for(let x=0;x<g.N;x++)all.push([x,y]);g.score+=1000;return m3Clear(g,all)}
 if(A==='rainbow'||Bs==='rainbow'){const rb=A==='rainbow'?a:b,o=A==='rainbow'?b:a,[rx,ry]=A==='rainbow'?[bx,by]:[ax,ay],[ox,oy]=A==='rainbow'?[ax,ay]:[bx,by];
  if(o.sp){const col=o.c;const pos=[[rx,ry]];for(let y=0;y<g.N;y++)for(let x=0;x<g.N;x++){const c=g.cells[y][x];if(c&&c.c===col&&c.sp!=='rainbow'){if(!c.sp)c.sp=o.sp==='bomb'?'bomb':(Math.random()<.5?'rh':'rv');pos.push([x,y])}}rb.sp=null;g.cells[ry][rx]=null;return m3Clear(g,pos)}
  rb.target=o.c;return m3Clear(g,[[rx,ry]])}
 if(A&&Bs){const pos=[];const cx=bx,cy=by;
  if(A==='bomb'&&Bs==='bomb'){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)pos.push([cx+dx,cy+dy])}
  else if(A==='bomb'||Bs==='bomb'){for(let d=-1;d<=1;d++)for(let i=0;i<g.N;i++){pos.push([i,cy+d]);pos.push([cx+d,i])}}
  else{for(let i=0;i<g.N;i++){pos.push([i,cy]);pos.push([cx,i])}}
  a.sp=null;b.sp=null;g.score+=200;return m3Clear(g,pos)}
 return null}
/* full move: returns steps for animation */
function m3Move(g,ax,ay,bx,by){
 const a=at(g,ax,ay),b=at(g,bx,by);if(!a||!b||Math.abs(ax-bx)+Math.abs(ay-by)!==1)return {ok:false};
 g.cells[ay][ax]=b;g.cells[by][bx]=a;const steps=[{type:'swap'}];g.combo=0;
 const sc=(a.sp&&b.sp)||a.sp==='rainbow'||b.sp==='rainbow'?m3SwapCombo(g,a,b,bx,by,ax,ay):null;
 if(sc){g.combo=1;steps.push({type:'clear',cleared:sc,create:[]});m3Gravity(g);steps.push({type:'fall'})}
 else{const r=m3Resolve(g,[[bx,by],[ax,ay]]);if(!r){g.cells[ay][ax]=a;g.cells[by][bx]=b;return {ok:false,steps:[{type:'swap'},{type:'back'}]}}steps.push({type:'clear',...r});m3Gravity(g);steps.push({type:'fall'})}
 let n=0;while(n++<40){const r=m3Resolve(g);if(!r)break;steps.push({type:'clear',...r});m3Gravity(g);steps.push({type:'fall'})}
 g.moves--;g.stats.moves++;
 let shuffled=false;if(!m3HasMove(g)){m3Shuffle(g);shuffled=true;steps.push({type:'shuffle'})}
 return {ok:true,steps,combo:g.combo,shuffled}}
function m3Hammer(g,x,y){g.combo=1;const cl=m3Clear(g,[[x,y]]);const steps=[{type:'clear',cleared:cl,create:[]}];m3Gravity(g);steps.push({type:'fall'});let n=0;while(n++<40){const r=m3Resolve(g);if(!r)break;steps.push({type:'clear',...r});m3Gravity(g);steps.push({type:'fall'})}if(!m3HasMove(g)){m3Shuffle(g);steps.push({type:'shuffle'})}return {ok:true,steps,combo:g.combo}}
/* greedy AI (tests / 托管) */
function m3Best(g){let best=null;const N=g.N;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const [dx,dy] of [[1,0],[0,1]]){const x2=x+dx,y2=y+dy;if(x2>=N||y2>=N)continue;const a=g.cells[y][x],b=g.cells[y2][x2];let sc=0;
  if(a.sp==='rainbow'||b.sp==='rainbow'||(a.sp&&b.sp))sc=60;else{g.cells[y][x]=b;g.cells[y2][x2]=a;const rs=m3Runs(g);g.cells[y][x]=a;g.cells[y2][x2]=b;if(!rs.length)continue;sc=rs.reduce((s,r)=>s+r.cells.length+(r.cells.length>=4?6:0)+(r.cells.length>=5?12:0),0)+rs.reduce((s,r)=>s+r.cells.filter(([cx,cy])=>g.cells[cy][cx].sp).length*8,0)}
  sc+=Math.random()*0.5;if(!best||sc>best.sc)best={sc,ax:x,ay:y,bx:x2,by:y2}}
 return best}

/* rules */
$('#rules').innerHTML=`
<h4>关于 AVA</h4>AVA 就是本游戏的欢乐豆，用于支付牌局入场费、赢取奖池，以及在商城兑换装扮。<b>新玩家没有初始余额</b>：正式版余额来自 AVA 生态账户；当前测试版可在「我的 → 设置 → 测试工具」中手动设置余额。

<h4>匹配与入场费奖池（销毁机制）</h4>斗地主 / 麻将 / 台球：点击「开始匹配」后进入匹配界面（最多等待 ${MATCH_CFG.matchWaitSeconds} 秒），<b>匹配成功开局时才扣除入场费</b>，取消匹配不扣费。测试版暂无真人玩家，空位由 <b>AI 机器人</b>（头像带「AI」标记）补齐。<br>
初级场 入场费 <b>10</b> · 中级场 <b>50</b> · 高级场 <b>100</b> AVA。<b>只有真人玩家支付入场费</b>，AI 座位不出钱、也不分奖池：<b>奖池 = 真人玩家入场费之和</b>。<br>
· 奖池 <b>50% 永久销毁</b>；另 50% 按<b>获胜方座位</b>平分（斗地主农民胜为 2 席），<b>落在 AI 座位上的份额一并销毁</b>，只有真人拿到奖励。<br>
· 如果获胜方没有真人（AI 获胜），这 50% <b>也全部销毁</b>。<br>
· <b>麻将流局</b>：50% 销毁，50% 平均退还给真人玩家。<br>
· <b>AVA 只按整数结算</b>：平分不尽时向下取整，<b>余数一并销毁</b>。商城兑换、消消乐道具花费的 AVA 也全部销毁。<br>
<table class="res" style="margin:6px 0"><tr><th>房间</th><th>入场费</th><th>奖池（1 真人 + AI）</th><th>地主胜 / 胡牌 / 台球胜</th><th>斗地主农民胜</th><th>麻将流局退还</th><th>AI 获胜</th></tr>${ROOMS.map(r=>{const e=econLines('ddz',r.fee),m=realRefund([{me:true},{ai:true},{ai:true},{ai:true}],r.fee);return `<tr><td>${r.name}</td><td>${r.fee}</td><td>${e.pot}</td><td>${e.win}</td><td>${e.farm}</td><td>${m.each}</td><td>全部销毁</td></tr>`}).join('')}</table>
例：中级场 3 名真人斗地主（奖池 150），农民方 2 名真人获胜 → 50% = 75，每人 37，余 1 与另一半 75 一起销毁（共 76）。<br>
<h4>中途退出（放弃）</h4>对局开始后可随时点「退出」并确认：<b>中途退出视为放弃，入场费不退</b>，也不获得任何奖励。该局奖池（真人入场费）<b>50% 永久销毁</b>，另 50% 由<b>其余玩家平分</b>（向下取整）；落在 AI 座位上的份额与余数一并销毁。斗地主 / 麻将 / 台球均适用；对局记录标记为「放弃」。测试版（1 名真人 + AI）退出后本局立即结算；正式版多人局中其余真人继续对局。<br>消消乐挑战赛中途退出：本次<b>不提交成绩</b>，入场费留在当日奖池参与 00:00 结算，同样占用当日挑战次数；免费练习可随时离开。
<h4>等级与房间解锁</h4>每完成一局 +${LEVEL_CFG.xp.play} 经验，获胜再 +${LEVEL_CFG.xp.win}；消消乐挑战赛按得分获得经验。<b>中级场 Lv${LEVEL_CFG.unlock[1]} 解锁（约 20 局）</b>，<b>高级场 Lv${LEVEL_CFG.unlock[2]} 解锁（约 60 局）</b>，所有游戏通用。等级阈值由服务器配置。
· 炸弹倍数、麻将番型、每日任务只计入<b>荣誉分</b>，用于排行榜，不改变 AVA。
<h4>斗地主</h4>54 张牌，三人各 17 张，留 3 张底牌。叫分 1/2/3 分，最高者为地主并获得底牌；无人叫则重新发牌。地主先出，逆时针轮流，须出同牌型且更大的牌或「不出」；炸弹可管任何非炸弹牌型，王炸最大。<br>
牌型：单张、对子、三张、三带一、三带一对、顺子(≥5张,3~A)、连对(≥3对)、飞机(可带同数量单张或对子)、四带二、炸弹、王炸。2 和王不能进顺子/连对/飞机。<br>
荣誉倍数：叫分 × 2^炸弹数 × 春天/反春 ×2。
<h4>麻将（简化推倒胡）</h4>136 张（万条筒 1~9 + 东南西北中发白，无花牌），四人各 13 张，庄家先摸。可碰、明杠/暗杠/加杠，不能吃。胡牌：4 组面子 + 1 对将，或七对；可自摸或点炮。牌墙摸完为流局。<br>
番型（荣誉分）：平胡 1、碰碰胡 2、混一色 2、清一色 4、七对 4；明杠/加杠 +1、暗杠 +2；自摸、杠上开花 ×2。
<h4>台球 · 中式八球（1 对 1）</h4>开球：母球置于开球线后（自由摆放），开球须进球或至少 4 颗球碰库，否则犯规。开球后为<b>开放球局</b>，第一个合法进球决定全色（1–7）或花色（9–15）。<br>
每杆须<b>先击中本方球</b>，且击球后有球进袋或有球碰库；本方进球可继续击球。<br>
<b>犯规</b>（母球落袋、未击中球、先击中对方球或黑八、击球后无球碰库）→ 对手获得<b>自由球</b>（母球可放任意位置）。<br>
清完本方球后合法打进<b>黑八获胜</b>；提前打进黑八、或打进黑八同时犯规（如母球落袋）→ <b>直接判负</b>。开球进黑八则黑八复位。<br>
操作：在球台上拖动瞄准（显示瞄准线与目标虚影球），右侧/下方力度条按住拖动蓄力、松开出杆；左上小母球可设置高低杆与左右塞。AI 难度随房间提升。
<h4>水果消消乐</h4>单人玩法（草莓 / 橙子 / 柠檬 / 青苹果 / 蓝莓 / 葡萄）：免费练习每天 ${M3_CFG.freePerDay} 次（不消耗也不奖励 AVA）；挑战赛按档位入场费进入<b>每日奖池</b>，同日同档同一棋盘，${M3_CFG.moves} 步定输赢；每天 00:00（Asia/Shanghai）结算：<b>50% 销毁，50% 按名次分给前 10%</b>（线性递减权重，向下取整，余数销毁；不足 10 人只奖励第 1 名）。道具用 AVA 兑换，花费全部销毁。详见消消乐页面的「规则」。
<h4>互动与语音</h4>对局中 💬 可发送快捷短语、表情或文字（最多 30 字，自动过滤不文明用语），🎁 可向对手投掷互动道具；开启「语音报牌」后会播报出牌与快捷短语。设置中可「屏蔽聊天」。`;

function avEl(game,s){return $(game==='ddz'?'#dz-av'+s:game==='mj'?'#mj-av'+s:'#bl-av'+s)}
function spawnAt(x,y,html,cls,life){const e=document.createElement('div');e.className='emo-fly '+(cls||'');e.style.transition='none';e.innerHTML=html;e.style.left=x+'px';e.style.top=y+'px';$('#app').appendChild(e);setTimeout(()=>e.remove(),life||1200);return e}
function propImpact(id,x,y){
 const coinI='<i class="cimg" style="position:static;display:block;width:28px;height:28px"></i>';
 if(id==='e1'){for(let i=0;i<8;i++){const p=spawnAt(x,y,'🌸');p.style.fontSize='18px';p.style.transition='all .8s ease-out';requestAnimationFrame(()=>{p.style.transform=`translate(${Math.cos(i*.785)*46}px,${Math.sin(i*.785)*46}px) rotate(${rnd(360)}deg)`;p.style.opacity='0'})}}
 else if(id==='e2'){const s=spawnAt(x-4,y,'🍳','',1500);s.style.fontSize='42px';s.style.animation='pop 1.4s forwards'}
 else if(id==='e3'){const s=spawnAt(x-10,y-10,'💥','',900);s.style.fontSize='58px';s.style.animation='pop .9s forwards';sfx('bomb');buzz([30,40,60]);const a=$('#app');a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),500)}
 else if(id==='e4'){sfx('coin');for(let i=0;i<10;i++){const p=spawnAt(x,y,coinI);p.style.transition='all .9s cubic-bezier(.2,.7,.3,1)';requestAnimationFrame(()=>{p.style.transform=`translate(${rnd(110)-55}px,${-30-rnd(60)}px)`;p.style.opacity='0'})}const t=spawnAt(x-20,y-30,'<b style="font-size:16px;color:#ffe08a;text-shadow:0 2px 4px #000">招财进宝</b>','',1300);t.style.animation='pop 1.3s forwards'}
 else{const s=spawnAt(x,y,'👍','',900);s.style.animation='pop .9s forwards'}
}
function throwProp(game,from,to,id){
 const it=item('emote',id),a=avEl(game,from),b=avEl(game,to);if(!a||!b)return;
 const app=gbr($('#app')),ra=gbr(a),rb=gbr(b);
 const f=document.createElement('div');f.className='emo-fly';f.innerHTML=it.v==='coin'?'<i class="cimg" style="position:static;display:block;width:34px;height:34px"></i>':it.v;
 sfx('emote');f.style.left=(ra.left-app.left)+'px';f.style.top=(ra.top-app.top)+'px';if(id==='e2'||id==='e3')f.style.transition='all .7s cubic-bezier(.3,.7,.4,1),transform .7s linear';
 $('#app').appendChild(f);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=(rb.left-app.left)+'px';f.style.top=(rb.top-app.top)+'px';if(id==='e2'||id==='e3')f.style.transform='rotate(540deg)'}));
 setTimeout(()=>{f.remove();propImpact(id,rb.left-app.left+4,rb.top-app.top+2)},720);
 if(from===0&&Math.random()<.45){const tok=gameTok(game);setTimeout(()=>{if(gameTok(game)===tok)throwProp(game,to,0,pick(['e0','e1','e2']))},1500)}
}

/* v10.1 iOS touch lock: block page drag / rubber-band / pinch outside real scrollers */
(function(){
 const canScroll=(el,dx,dy)=>{for(let e=el;e&&e!==document.body&&e!==document.documentElement;e=e.parentElement){const cs=getComputedStyle(e);
   if(Math.abs(dy)>=Math.abs(dx)){if(/(auto|scroll)/.test(cs.overflowY)&&e.scrollHeight>e.clientHeight+1)return true}
   else if(/(auto|scroll)/.test(cs.overflowX)&&e.scrollWidth>e.clientWidth+1)return true}return false};
 let sx=0,sy=0;
 document.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){sx=t.clientX;sy=t.clientY}},{passive:true});
 document.addEventListener('touchmove',e=>{if(e.touches.length>1){e.preventDefault();return}
  const tg=e.target;if(tg&&tg.closest&&tg.closest('input,textarea,select'))return;
  const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
  if(!canScroll(tg,dx,dy)){e.preventDefault();DBG.tmBlocked=(DBG.tmBlocked||0)+1}},{passive:false});
 ['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
 document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
 window.addEventListener('scroll',()=>{if(window.scrollY||window.scrollX)window.scrollTo(0,0)},{passive:true});
})();
